# Met à jour automatiquement le catalogue du site dès qu'un document est ajouté, remplacé ou supprimé (depuis le site ou depuis GitHub).
name: Mettre à jour le catalogue
on:
  push:
    branches: [main]
    paths:
      - "documents/**"
      - "data/meta.json"
      - "data/config.json"
      - "data/liens.json"
      - "outils/generer_catalogue.py"
      - ".github/workflows/catalogue.yml"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: catalogue
  cancel-in-progress: false
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Outils (vignettes PDF, vidéos, Word, Excel, PowerPoint)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils ffmpeg python3-pil libreoffice-writer libreoffice-calc libreoffice-impress fonts-liberation fonts-dejavu-core
      - name: Générer le catalogue
        run: python3 outils/generer_catalogue.py
      - name: Enregistrer
        run: |
          git config user.name "Relais DOTR (automatique)"
          git config user.email "actions@users.noreply.github.com"
          git add -A data assets/thumbs
          if ! git diff --cached --quiet; then
            git commit -m "Catalogue mis à jour automatiquement"
            git pull --rebase origin main
            git push
          fi
      - name: Demander la mise en ligne du site
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
